name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TZ: UTC

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, fileinfo

      - name: Validate composer.json
        # No --strict: the release job relies on the "version" field, which strict mode flags as a warning.
        run: composer validate --no-check-publish --no-check-lock

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Advisories appear without code changes, so on PRs this reports but does not block.
      - name: Security audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: composer audit --locked

      - name: Duplicate code
        run: composer run find-duplicate-code

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

      - name: Tests
        run: vendor/bin/pest --ci

  # Matrix of supported PHP/Laravel versions, mirroring the package's declared constraints.
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.3']
        laravel: ['12.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          # - laravel: 13.*
          #   testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, fileinfo

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest --ci

  s3-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 7ced9663e6a791fef9dc6be798ff24cda9c730ac
          path: .minio-src
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: .minio-src/go.sum
      - name: Build MinIO
        working-directory: .minio-src
        run: CGO_ENABLED=0 go build -tags kqueue -trimpath -o "$GITHUB_WORKSPACE/minio" .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, fileinfo
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=chat-test MINIO_ROOT_PASSWORD=chat-test-password "$GITHUB_WORKSPACE/minio" server "$RUNNER_TEMP/minio-data" > "$RUNNER_TEMP/minio.log" 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:9000/minio/health/live
      - name: Test S3 uploads
        env:
          LE_CHAT_S3_ENDPOINT: http://127.0.0.1:9000
        run: vendor/bin/pest tests/AttachmentHttpTest.php --filter='S3 compatible store'

  release:
    needs: [ci, compatibility, s3-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect unreleased version
        id: version
        run: |
          current=$(jq -r '.version // empty' composer.json)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          # Compare to existing tags (not the previous commit) so a bump whose own CI run failed still gets released later
          if [ -n "$current" ] && ! git rev-parse -q --verify "refs/tags/$current" >/dev/null && ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.current }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.current }}" \
            --generate-notes
